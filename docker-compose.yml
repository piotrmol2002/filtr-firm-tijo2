services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: filtr
      POSTGRES_PASSWORD: filtr
      POSTGRES_DB: filtr
      # Unicode case mapping, so lower('MAŁOPOLSKIE') in SQL equals Python's casefold.
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filtr -d filtr"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://filtr:filtr@db:5432/filtr
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

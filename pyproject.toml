[project]
name = "filtr-firm"
version = "0.1.0"
description = "Filtr kwalifikacji nowo zarejestrowanych firm z rejestrów CEIDG i KRS"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.54",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filtr_firm"]

[tool.ruff]
line-length = 100
target-version = "py312"
